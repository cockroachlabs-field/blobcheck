services:

  cockroachdb-v24.3:
    profiles: ["v24.3"]
    image: cockroachdb/cockroach:latest-v24.3
    entrypoint: /cockroach/cockroach
    command: start-single-node --insecure --store type=mem,size=2G
    network_mode: host

  cockroachdb-v25.2:
    profiles: ["v25.2"]
    image: cockroachdb/cockroach:latest-v25.2
    entrypoint: /cockroach/cockroach
    command: start-single-node --insecure --store type=mem,size=2G
    network_mode: host

  cockroachdb-v25.4:
    profiles: ["v25.4"]
    image: cockroachdb/cockroach:latest-v25.4
    entrypoint: /cockroach/cockroach
    command: start-single-node --insecure --store type=mem,size=2G
    network_mode: host

  cockroachdb-v26.2:
    profiles: ["v26.2"]
    image: cockroachdb/cockroach:latest-v26.2
    entrypoint: /cockroach/cockroach
    command: start-single-node --insecure --store type=mem,size=2G
    network_mode: host

  minio:
      image: us-central1-docker.pkg.dev/cockroach-testeng-infra/roachtest-support/minio:RELEASE.2024-10-02T17-50-41Z
      healthcheck:
          test: ["CMD", "curl", "--fail", "http://localhost:29001/"]
          interval: 2s
          timeout: 2s
          retries: 10
          start_period: 5s
      command: server --console-address ":29001" --address ":29000" /data
      network_mode: host
      environment:
        -  MINIO_ROOT_USER=cockroach
        -  MINIO_ROOT_PASSWORD=cockroach
  create_bucket:
      # The minio server image bundles the mc client, so no separate client image is needed.
      image: us-central1-docker.pkg.dev/cockroach-testeng-infra/roachtest-support/minio:RELEASE.2024-10-02T17-50-41Z
      depends_on:
        minio:
          condition: service_healthy
      network_mode: host
      environment:
        -  MINIO_ROOT_USER=cockroach
        -  MINIO_ROOT_PASSWORD=cockroach
      entrypoint: >
        /bin/sh -c "
        /usr/bin/mc alias set dockerminio http://localhost:29000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        /usr/bin/mc mb dockerminio/test;
        exit 0;
        "
